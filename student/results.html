<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - Gamal Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        :root { --teal: #1a7a65; --teal-dark: #0d5c4a; --teal-light: #e8f5f1; --sidebar-w: 240px; --header-h: 60px; }
        body { background: #f5f6f8; display: flex; flex-direction: column; min-height: 100vh; }

        .top-header { position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); background: var(--teal); display: flex; align-items: center; justify-content: space-between; padding: 0 20px 0 0; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .header-logo { display: flex; align-items: center; gap: 10px; padding: 0 20px; }
        .header-logo .logo-square { width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .header-logo span { color: white; font-size: 13px; font-weight: 600; line-height: 1.3; }
        .user-avatar { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.3); border: 2px solid rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px; }
        .menu-toggle { display: none; background: none; border: none; color: white; font-size: 22px; cursor: pointer; padding: 5px 15px; }

        .layout { display: flex; margin-top: var(--header-h); min-height: calc(100vh - var(--header-h)); }
        .sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #e8e8e8; position: fixed; top: var(--header-h); left: 0; height: calc(100vh - var(--header-h)); overflow-y: auto; padding: 20px 0; z-index: 900; transition: transform 0.3s; }
        .sidebar-section-title { font-size: 11px; font-weight: 700; color: #999; letter-spacing: 1px; padding: 8px 20px 4px; text-transform: uppercase; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 20px; color: #555; text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.2s; position: relative; cursor: pointer; }
        .nav-item:hover { color: var(--teal); background: var(--teal-light); }
        .nav-item.active { color: var(--teal); background: var(--teal-light); font-weight: 600; }
        .nav-item.active::after { content: '•'; position: absolute; right: 15px; color: var(--teal); font-size: 20px; }
        .nav-divider { height: 1px; background: #f0f0f0; margin: 10px 20px; }

        .main-content { margin-left: var(--sidebar-w); flex: 1; padding: 30px; }
        .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #888; margin-bottom: 12px; }
        .page-title { font-size: 32px; font-weight: 800; color: #1a1a2e; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }

        /* Student Record Card */
        .student-record-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 20px 25px;
            margin-bottom: 20px;
        }

        .student-record-card .record-label {
            font-size: 11px;
            font-weight: 700;
            color: #999;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .student-record-card h3 {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 4px;
        }

        .student-record-card p {
            font-size: 13px;
            color: #888;
        }

        /* Term Results */
        .term-section {
            background: white;
            border: 1px solid #eee;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .term-header {
            padding: 14px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            text-align: right;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
        }

        .results-table thead {
            background: #f0f7f4;
        }

        .results-table th {
            padding: 12px 20px;
            font-size: 11px;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: left;
        }

        .results-table th:last-child { text-align: right; }

        .results-table td {
            padding: 14px 20px;
            font-size: 14px;
            color: #333;
            border-bottom: 1px solid #f5f5f5;
        }

        .results-table td:last-child { text-align: right; font-weight: 600; color: var(--teal); }

        .results-table tr:last-child td { border-bottom: none; }

        .term-footer {
            padding: 14px 20px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .term-footer .label { color: #888; }
        .term-footer .value { font-weight: 700; color: var(--teal); }

        .empty-state { text-align: center; padding: 60px 20px; color: #aaa; }
        .empty-icon { font-size: 48px; margin-bottom: 15px; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 20px 15px; }
            .menu-toggle { display: block; }
            .page-title { font-size: 24px; }
            .results-table { font-size: 13px; }
        }
    </style>
</head>
<body>

<header class="top-header">
    <div class="header-logo">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <div class="logo-square">🎓</div>
        <span>ENG: Gamal<br>Elmzayen Portal</span>
    </div>
    <div style="padding-right:10px">
        <div class="user-avatar" id="userAvatarTop">G</div>
    </div>
</header>

<div class="layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">
            <p class="sidebar-section-title">Main Menu</p>
            <a href="home.html" class="nav-item"><span>🏠</span> Home</a>
            <a href="lectures.html" class="nav-item"><span>📚</span> Lectures</a>
            <a href="profile.html" class="nav-item"><span>👤</span> Profile</a>
        </div>
        <div class="nav-divider"></div>
        <div class="sidebar-section">
            <p class="sidebar-section-title">Activities</p>
            <a href="results.html" class="nav-item active"><span>📊</span> Results</a>
            <a href="assignments.html" class="nav-item"><span>📋</span> Assignments</a>
            <a href="timetable.html" class="nav-item"><span>📅</span> Timetables</a>
            <a href="quizzes.html" class="nav-item"><span>❓</span> Quizzes</a>
            <a href="sheets.html" class="nav-item"><span>📄</span> Sheets</a>
        </div>
        <div class="nav-divider"></div>
        <a href="../index.html" class="nav-item" onclick="logout()" style="color:#e53e3e;"><span>🚪</span> Logout</a>
    </aside>

    <main class="main-content">
        <div class="breadcrumb">
            <a href="home.html">🏠</a> <span>›</span> <span>Results</span>
        </div>
        <h1 class="page-title">My Results</h1>

        <div class="student-record-card">
            <div class="record-label">Student Record</div>
            <h3 id="studentRecordName">Student Name</h3>
            <p id="studentRecordId">Academic ID: 262001</p>
        </div>

        <div id="resultsContainer"></div>
    </main>
</div>

<script>
    if (!localStorage.getItem('userType') || localStorage.getItem('userType') !== 'student') {
        window.location.href = '../index.html';
    }

    const studentId = localStorage.getItem('studentId') || '262001';
    const userName = localStorage.getItem('userName') || 'Student';
    document.getElementById('userAvatarTop').textContent = studentId.slice(-2);
    document.getElementById('studentRecordName').textContent = userName;
    document.getElementById('studentRecordId').textContent = 'Academic ID: ' + studentId;

    function loadResults() {
        const container = document.getElementById('resultsContainer');
        const allGrades = JSON.parse(localStorage.getItem('grades') || '{}');
        const studentGrades = allGrades[studentId] || [];

        if (studentGrades.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📊</div>
                    <p>No results available yet.</p>
                </div>`;
            return;
        }

        // Group by term
        const terms = {};
        studentGrades.forEach(g => {
            const term = g.term || 'Current Term';
            if (!terms[term]) terms[term] = [];
            terms[term].push(g);
        });

        let html = '';
        Object.keys(terms).forEach(term => {
            const grades = terms[term];
            html += `
                <div class="term-section">
                    <div class="term-header">${term}</div>
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th>Course</th>
                                <th style="text-align:right">Evaluation</th>
                            </tr>
                        </thead>
                        <tbody>`;

            grades.forEach(g => {
                html += `
                    <tr>
                        <td>${g.subject}</td>
                        <td>${g.grade}</td>
                    </tr>`;
            });

            const overall = grades[grades.length - 1]?.overall || 'Pass';
            html += `
                        </tbody>
                    </table>
                    <div class="term-footer">
                        <span class="label">الحالة العامة للترم</span>
                        <span class="value">${overall}</span>
                    </div>
                </div>`;
        });

        container.innerHTML = html;
    }

    loadResults();

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
    function logout() { localStorage.removeItem('userType'); }
</script>
<script src="../js/storage.js"></script>
</body>
</html>
