<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Timetables - ENG: Gamal Elmzayen</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        :root { --teal: #0d7b6e; --teal-dark: #1a5f5f; --teal-light: #e8f5f3; --sidebar-width: 240px; --header-height: 60px; }
        html, body { width: 100%; min-height: 100vh; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
        body { background: #f5f6fa; display: flex; }
        .top-header { position: fixed; top: 0; left: 0; right: 0; height: var(--header-height); background: var(--teal-dark); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 1000; }
        .header-logo { display: flex; align-items: center; gap: 12px; }
        .logo-mark { width: 38px; height: 38px; background: rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px; }
        .header-logo span { color: white; font-weight: 700; font-size: 15px; }
        .hamburger { display: none; background: none; border: none; color: white; font-size: 22px; cursor: pointer; }
        .header-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--teal), #2d9e7a); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 16px; border: 2px solid rgba(255,255,255,0.3); overflow: hidden; cursor: pointer; }
        .header-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .sidebar { position: fixed; top: var(--header-height); left: 0; width: var(--sidebar-width); height: calc(100vh - var(--header-height)); background: white; border-right: 1px solid #e5e7eb; overflow-y: auto; z-index: 900; padding: 20px 0; transition: transform 0.3s; }
        .menu-section { padding: 0 16px; margin-bottom: 8px; }
        .menu-label { font-size: 11px; font-weight: 700; color: #9ca3af; letter-spacing: 1px; text-transform: uppercase; padding: 12px 8px 6px; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: #4b5563; text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 500; transition: all 0.2s; position: relative; }
        .nav-link:hover, .nav-link.active { background: var(--teal-light); color: var(--teal); }
        .nav-link.active { font-weight: 600; }
        .nav-link.active::after { content: ''; position: absolute; right: 10px; width: 8px; height: 8px; background: var(--teal); border-radius: 50%; }
        .nav-icon { font-size: 18px; width: 22px; text-align: center; }
        .nav-divider { height: 1px; background: #f3f4f6; margin: 12px 16px; }
        .sidebar-logout { display: flex; align-items: center; gap: 12px; padding: 10px 28px; color: #6b7280; cursor: pointer; font-size: 14px; border: none; background: none; width: 100%; }
        .sidebar-logout:hover { color: #ef4444; }
        .main-content { margin-left: var(--sidebar-width); margin-top: var(--header-height); flex: 1; padding: 30px; animation: fadeInPage 0.4s ease-out; }
        @keyframes fadeInPage { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .breadcrumb { display: flex; align-items: center; gap: 6px; color: #6b7280; font-size: 14px; margin-bottom: 10px; }
        .breadcrumb a { color: #6b7280; text-decoration: none; }
        .page-title { font-size: 32px; font-weight: 800; color: #111827; }
        .separator { height: 1px; background: #e5e7eb; margin-bottom: 25px; }
        .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .back-dashboard { background: var(--teal); color: white; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; }
        .timetable-section { background: white; border: 1px solid #e5e7eb; border-radius: 10px; margin-bottom: 25px; overflow: hidden; animation: slideIn 0.4s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-15px); } to { opacity: 1; transform: translateX(0); } }
        .timetable-section-header { padding: 16px 24px; font-size: 16px; font-weight: 700; color: #374151; background: #fafafa; border-bottom: 1px solid #e5e7eb; }
        .timetable-meta { padding: 14px 24px; border-bottom: 1px solid #e5e7eb; font-size: 14px; color: #374151; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .semester-badge { display: inline-block; background: #ede9fe; color: #7c3aed; border-radius: 20px; padding: 3px 12px; font-size: 13px; font-weight: 600; }
        .timetable-wrap { overflow-x: auto; }
        .timetable-table { width: 100%; border-collapse: collapse; min-width: 700px; }
        .timetable-table th { padding: 12px 16px; font-size: 13px; font-weight: 600; color: #374151; border: 1px solid #e5e7eb; background: #f0faf8; text-align: center; white-space: nowrap; }
        .timetable-table td { padding: 14px 12px; border: 1px solid #e5e7eb; font-size: 12px; text-align: center; vertical-align: top; min-width: 120px; }
        .day-cell { font-weight: 700; color: #374151; background: #f9fafb; text-align: right; padding-right: 16px; }
        .class-cell { background: #e8f5f3; border-radius: 6px; padding: 8px; }
        .class-name { font-weight: 700; color: #1d4ed8; font-size: 12px; margin-bottom: 4px; }
        .class-teacher { color: #4b5563; font-size: 11px; margin-bottom: 3px; }
        .class-room { color: #6b7280; font-size: 11px; }
        .empty-timetable { text-align: center; padding: 50px 20px; color: #9ca3af; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 850; }
        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .sidebar.open { transform: translateX(0); } .main-content { margin-left: 0; padding: 20px 15px; } .hamburger { display: block; } .overlay.show { display: block; } .page-title { font-size: 26px; } }
    </style>
</head>
<body>
    <header class="top-header">
        <div class="header-logo">
            <button class="hamburger" onclick="toggleSidebar()">☰</button>
            <div class="logo-mark">G</div>
            <span>ENG: Gamal Elmzayen</span>
        </div>
        <div class="header-avatar" id="headerAvatar" onclick="window.location.href='profile.html'"></div>
    </header>
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="menu-section">
            <div class="menu-label">Main Menu</div>
            <a href="home.html" class="nav-link"><span class="nav-icon">🏠</span> Home</a>
            <a href="lectures.html" class="nav-link"><span class="nav-icon">📚</span> Lectures</a>
            <a href="profile.html" class="nav-link"><span class="nav-icon">👤</span> Profile</a>
            <a href="results.html" class="nav-link"><span class="nav-icon">📋</span> My Results</a>
            <a href="timetable.html" class="nav-link active"><span class="nav-icon">📅</span> Timetables</a>
        </div>
        <div class="nav-divider"></div>
        <div class="menu-section">
            <div class="menu-label">Activities</div>
            <a href="sheets.html" class="nav-link"><span class="nav-icon">📄</span> Sheets</a>
            <a href="assignments.html" class="nav-link"><span class="nav-icon">📝</span> Assignments</a>
            <a href="quizzes.html" class="nav-link"><span class="nav-icon">❓</span> Quizzes</a>
        </div>
        <div class="nav-divider"></div>
        <button class="sidebar-logout" onclick="logout()"><span>🚪</span> Logout</button>
    </aside>
    <main class="main-content">
        <div class="breadcrumb"><a href="home.html">🏠</a><span>›</span><span>Timetables</span></div>
        <div class="page-header">
            <h1 class="page-title">Timetables</h1>
            <a href="home.html" class="back-dashboard">Back to Dashboard</a>
        </div>
        <div class="separator"></div>
        <div id="timetableContainer"></div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/cloud.js"></script>
    <script src="../js/avatar.js"></script>
    <script>
        if (!localStorage.getItem('userType') || localStorage.getItem('userType') !== 'student') window.location.href = '../index.html';

        function loadTimetable() {
            const container = document.getElementById('timetableContainer');
            const days = ['Saturday', 'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday'];

            CloudStorage.listen('timetables', (timetables) => {
                const data = timetables || [];
                if (data.length === 0) {
                    container.innerHTML = '<div class="timetable-section"><div class="empty-timetable"><p style="font-size:48px;margin-bottom:15px">📅</p><p>No timetable available yet.</p></div></div>';
                    return;
                }
                container.innerHTML = data.map(tt => {
                    const periods = tt.periods || [];
                    const periodHeaders = periods.map(p => '<th>' + p + '</th>').join('');
                    const rows = days.map(day => {
                        const classes = (tt.schedule && tt.schedule[day]) || [];
                        const cells = periods.map((_, i) => {
                            const cls = classes[i];
                            if (cls && cls.name) {
                                return '<td><div class="class-cell"><div class="class-name">' + cls.name + '</div><div class="class-teacher">' + (cls.teacher || '') + '</div><div class="class-room">' + (cls.room || '') + '</div></div></td>';
                            }
                            return '<td></td>';
                        }).join('');
                        return '<tr><td class="day-cell">' + day + '</td>' + cells + '</tr>';
                    }).join('');
                    return `
                        <div class="timetable-section">
                            <div class="timetable-section-header">${tt.level || 'Schedule'}</div>
                            <div class="timetable-meta">
                                📚 ${tt.program || 'Information Technology Program'}
                                🗓 ${tt.year || '2025-2026'}
                                <span class="semester-badge">${tt.term || 'First Term'}</span>
                            </div>
                            <div class="timetable-wrap">
                                <table class="timetable-table">
                                    <thead><tr><th>Day/Period</th>${periodHeaders}</tr></thead>
                                    <tbody>${rows}</tbody>
                                </table>
                            </div>
                        </div>`;
                }).join('');
            });
        }
        loadTimetable();

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('show'); }
        function logout() { localStorage.removeItem('userType'); localStorage.removeItem('studentId'); localStorage.removeItem('userEmail'); window.location.href = '../index.html'; }
    </script>
</body>
</html>
