<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetables - Gamal Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        :root { --teal: #1a7a65; --teal-dark: #0d5c4a; --teal-light: #e8f5f1; --sidebar-w: 240px; --header-h: 60px; }
        body { background: #f5f6f8; display: flex; flex-direction: column; min-height: 100vh; }

        .top-header { position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); background: var(--teal); display: flex; align-items: center; justify-content: space-between; padding: 0 20px 0 0; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .header-logo { display: flex; align-items: center; gap: 10px; padding: 0 20px; }
        .header-logo .logo-square { width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .header-logo span { color: white; font-size: 13px; font-weight: 600; line-height: 1.3; }
        .user-avatar { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.3); border: 2px solid rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px; }
        .menu-toggle { display: none; background: none; border: none; color: white; font-size: 22px; cursor: pointer; padding: 5px 15px; }

        .layout { display: flex; margin-top: var(--header-h); min-height: calc(100vh - var(--header-h)); }
        .sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #e8e8e8; position: fixed; top: var(--header-h); left: 0; height: calc(100vh - var(--header-h)); overflow-y: auto; padding: 20px 0; z-index: 900; transition: transform 0.3s; }
        .sidebar-section-title { font-size: 11px; font-weight: 700; color: #999; letter-spacing: 1px; padding: 8px 20px 4px; text-transform: uppercase; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 20px; color: #555; text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.2s; position: relative; cursor: pointer; }
        .nav-item:hover { color: var(--teal); background: var(--teal-light); }
        .nav-item.active { color: var(--teal); background: var(--teal-light); font-weight: 600; }
        .nav-item.active::after { content: '•'; position: absolute; right: 15px; color: var(--teal); font-size: 20px; }
        .nav-divider { height: 1px; background: #f0f0f0; margin: 10px 20px; }

        .main-content { margin-left: var(--sidebar-w); flex: 1; padding: 30px; }
        .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #888; margin-bottom: 12px; }
        .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .page-title { font-size: 32px; font-weight: 800; color: #1a1a2e; }

        .back-dashboard-btn {
            background: var(--teal);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .back-dashboard-btn:hover { background: var(--teal-dark); }

        /* Timetable Card */
        .timetable-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 10px;
            margin-bottom: 25px;
            overflow: hidden;
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .timetable-info {
            padding: 14px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            color: #555;
        }

        .timetable-meta {
            padding: 18px 20px;
            border-bottom: 1px solid #eee;
        }

        .timetable-meta h3 { font-size: 16px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }

        .meta-tags { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: #666; }

        .meta-tag {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .badge-term {
            background: #f3e8ff;
            color: #7c3aed;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Table */
        .table-wrapper { overflow-x: auto; }

        .timetable-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        .timetable-table thead {
            background: linear-gradient(135deg, #d1ece6, #b2ddd5);
        }

        .timetable-table th {
            padding: 12px 15px;
            font-size: 12px;
            font-weight: 700;
            color: var(--teal-dark);
            text-align: center;
            border: 1px solid #e0ede9;
        }

        .timetable-table td {
            padding: 12px 15px;
            border: 1px solid #eee;
            text-align: center;
            font-size: 13px;
            vertical-align: top;
            min-height: 60px;
        }

        .timetable-table .day-cell {
            background: #f0faf6;
            font-weight: 700;
            color: #1a7a65;
            font-size: 14px;
        }

        .session-cell {
            background: #e8f5f1;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 11px;
            color: #333;
            line-height: 1.5;
        }

        .session-title { font-weight: 700; color: #1a1a2e; font-size: 12px; }
        .session-room { color: #888; }
        .session-type { color: var(--teal); }

        .empty-state { text-align: center; padding: 60px 20px; color: #aaa; }
        .empty-icon { font-size: 48px; margin-bottom: 15px; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 20px 15px; }
            .menu-toggle { display: block; }
            .page-title { font-size: 22px; }
        }
    </style>
</head>
<body>

<header class="top-header">
    <div class="header-logo">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <div class="logo-square">🎓</div>
        <span>ENG: Gamal<br>Elmzayen Portal</span>
    </div>
    <div style="padding-right:10px">
        <div class="user-avatar" id="userAvatarTop">G</div>
    </div>
</header>

<div class="layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">
            <p class="sidebar-section-title">Main Menu</p>
            <a href="home.html" class="nav-item"><span>🏠</span> Home</a>
            <a href="lectures.html" class="nav-item"><span>📚</span> Lectures</a>
            <a href="profile.html" class="nav-item"><span>👤</span> Profile</a>
        </div>
        <div class="nav-divider"></div>
        <div class="sidebar-section">
            <p class="sidebar-section-title">Activities</p>
            <a href="results.html" class="nav-item"><span>📊</span> Results</a>
            <a href="assignments.html" class="nav-item"><span>📋</span> Assignments</a>
            <a href="timetable.html" class="nav-item active"><span>📅</span> Timetables</a>
            <a href="quizzes.html" class="nav-item"><span>❓</span> Quizzes</a>
            <a href="sheets.html" class="nav-item"><span>📄</span> Sheets</a>
        </div>
        <div class="nav-divider"></div>
        <a href="../index.html" class="nav-item" onclick="logout()" style="color:#e53e3e;"><span>🚪</span> Logout</a>
    </aside>

    <main class="main-content">
        <div class="breadcrumb">
            <a href="home.html">🏠</a> <span>›</span> <span>Timetables</span>
        </div>

        <div class="page-header">
            <h1 class="page-title">Timetables</h1>
            <button class="back-dashboard-btn" onclick="window.location.href='home.html'">Back to Dashboard</button>
        </div>

        <div id="timetableContainer"></div>
    </main>
</div>

<script>
    if (!localStorage.getItem('userType') || localStorage.getItem('userType') !== 'student') {
        window.location.href = '../index.html';
    }

    const studentId = localStorage.getItem('studentId') || '262001';
    document.getElementById('userAvatarTop').textContent = studentId.slice(-2);

    const days = ['Saturday', 'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday'];

    function loadTimetable() {
        const container = document.getElementById('timetableContainer');
        const timetables = JSON.parse(localStorage.getItem('timetables') || '[]');

        if (timetables.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📅</div>
                    <p>No timetable available yet.</p>
                </div>`;
            return;
        }

        let html = '';
        timetables.forEach(tt => {
            html += `
                <div class="timetable-card">
                    <div class="timetable-info">${tt.program || 'Information Technology'}</div>
                    <div class="timetable-meta">
                        <h3>${tt.title || 'Academic Timetable'}</h3>
                        <div class="meta-tags">
                            <span class="meta-tag">📚 ${tt.program || 'IT Program'}</span>
                            <span class="meta-tag">👥 ${tt.year || '2025-2026'}</span>
                            <span class="badge-term">${tt.term || 'Current Term'}</span>
                        </div>
                    </div>
                    <div class="table-wrapper">
                        <table class="timetable-table">
                            <thead>
                                <tr>
                                    <th>Day/Period</th>
                                    ${tt.periods ? tt.periods.map(p => `<th>${p}</th>`).join('') : '<th>9:00 - 10:00</th><th>10:00 - 11:00</th><th>11:00 - 12:00</th>'}
                                </tr>
                            </thead>
                            <tbody>`;

            days.forEach(day => {
                const dayData = tt.schedule && tt.schedule[day] ? tt.schedule[day] : [];
                html += `<tr><td class="day-cell">${day}</td>`;
                const periodCount = tt.periods ? tt.periods.length : 3;
                for (let i = 0; i < periodCount; i++) {
                    const session = dayData[i];
                    if (session && session.subject) {
                        html += `
                            <td>
                                <div class="session-cell">
                                    <div class="session-title">${session.subject}</div>
                                    ${session.instructor ? `<div class="session-room">${session.instructor}</div>` : ''}
                                    ${session.room ? `<div class="session-room">${session.room}</div>` : ''}
                                    ${session.type ? `<div class="session-type">${session.type}</div>` : ''}
                                </div>
                            </td>`;
                    } else {
                        html += '<td></td>';
                    }
                }
                html += '</tr>';
            });

            html += `</tbody></table></div></div>`;
        });

        container.innerHTML = html;
    }

    loadTimetable();
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
    function logout() { localStorage.removeItem('userType'); }
</script>
<script src="../js/storage.js"></script>
</body>
</html>
