<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments - Gamal Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        :root { --teal: #1a7a65; --teal-dark: #0d5c4a; --teal-light: #e8f5f1; --sidebar-w: 240px; --header-h: 60px; }
        body { background: #f5f6f8; display: flex; flex-direction: column; min-height: 100vh; }

        .top-header { position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); background: var(--teal); display: flex; align-items: center; justify-content: space-between; padding: 0 20px 0 0; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .header-logo { display: flex; align-items: center; gap: 10px; padding: 0 20px; }
        .header-logo .logo-square { width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .header-logo span { color: white; font-size: 13px; font-weight: 600; line-height: 1.3; }
        .user-avatar { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.3); border: 2px solid rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px; }
        .menu-toggle { display: none; background: none; border: none; color: white; font-size: 22px; cursor: pointer; padding: 5px 15px; }

        .layout { display: flex; margin-top: var(--header-h); min-height: calc(100vh - var(--header-h)); }
        .sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #e8e8e8; position: fixed; top: var(--header-h); left: 0; height: calc(100vh - var(--header-h)); overflow-y: auto; padding: 20px 0; z-index: 900; transition: transform 0.3s; }
        .sidebar-section-title { font-size: 11px; font-weight: 700; color: #999; letter-spacing: 1px; padding: 8px 20px 4px; text-transform: uppercase; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 20px; color: #555; text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.2s; position: relative; cursor: pointer; }
        .nav-item:hover { color: var(--teal); background: var(--teal-light); }
        .nav-item.active { color: var(--teal); background: var(--teal-light); font-weight: 600; }
        .nav-item.active::after { content: '•'; position: absolute; right: 15px; color: var(--teal); font-size: 20px; }
        .nav-divider { height: 1px; background: #f0f0f0; margin: 10px 20px; }

        .main-content { margin-left: var(--sidebar-w); flex: 1; padding: 30px; }
        .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #888; margin-bottom: 12px; }
        .page-title { font-size: 32px; font-weight: 800; color: #1a1a2e; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }

        /* Assignment Accordion */
        .course-section {
            background: white;
            border: 1px solid #eee;
            border-radius: 10px;
            margin-bottom: 12px;
            overflow: hidden;
            animation: fadeInUp 0.4s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .course-header {
            padding: 16px 20px;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            font-weight: 700;
            font-size: 15px;
            color: #1a1a2e;
            transition: background 0.2s;
        }

        .course-header:hover { background: #f0f0f0; }

        .course-body { display: none; padding: 15px 20px; }
        .course-body.show { display: block; animation: slideDown 0.3s; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .course-intro {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }

        /* Inner Assignment Accordion */
        .assignment-item {
            border: 1px solid #eee;
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .assignment-header {
            padding: 13px 16px;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            color: #1a1a2e;
        }

        .assignment-header:hover { background: #f0f0f0; }

        .assignment-body {
            display: none;
            padding: 15px 16px;
            border-top: 1px solid #eee;
            background: white;
        }

        .assignment-body.show { display: block; }

        .assignment-meta { font-size: 13px; color: #666; margin-bottom: 8px; line-height: 1.8; }
        .assignment-meta .deadline { color: var(--teal); font-weight: 600; }
        .assignment-meta a { color: #1d4ed8; text-decoration: none; font-weight: 600; }

        .submitted-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #dcfce7;
            color: #166534;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 10px;
            width: 100%;
            justify-content: space-between;
        }

        .empty-state { text-align: center; padding: 60px 20px; color: #aaa; }
        .empty-icon { font-size: 48px; margin-bottom: 15px; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 20px 15px; }
            .menu-toggle { display: block; }
            .page-title { font-size: 24px; }
        }
    </style>
</head>
<body>

<header class="top-header">
    <div class="header-logo">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <div class="logo-square">🎓</div>
        <span>ENG: Gamal<br>Elmzayen Portal</span>
    </div>
    <div style="padding-right:10px">
        <div class="user-avatar" id="userAvatarTop">G</div>
    </div>
</header>

<div class="layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">
            <p class="sidebar-section-title">Main Menu</p>
            <a href="home.html" class="nav-item"><span>🏠</span> Home</a>
            <a href="lectures.html" class="nav-item"><span>📚</span> Lectures</a>
            <a href="profile.html" class="nav-item"><span>👤</span> Profile</a>
        </div>
        <div class="nav-divider"></div>
        <div class="sidebar-section">
            <p class="sidebar-section-title">Activities</p>
            <a href="results.html" class="nav-item"><span>📊</span> Results</a>
            <a href="assignments.html" class="nav-item active"><span>📋</span> Assignments</a>
            <a href="timetable.html" class="nav-item"><span>📅</span> Timetables</a>
            <a href="quizzes.html" class="nav-item"><span>❓</span> Quizzes</a>
            <a href="sheets.html" class="nav-item"><span>📄</span> Sheets</a>
        </div>
        <div class="nav-divider"></div>
        <a href="../index.html" class="nav-item" onclick="logout()" style="color:#e53e3e;"><span>🚪</span> Logout</a>
    </aside>

    <main class="main-content">
        <div class="breadcrumb">
            <a href="home.html">🏠</a> <span>›</span> <span>Assignments</span>
        </div>
        <h1 class="page-title">Assignments</h1>
        <div id="assignmentsContainer"></div>
    </main>
</div>

<script>
    if (!localStorage.getItem('userType') || localStorage.getItem('userType') !== 'student') {
        window.location.href = '../index.html';
    }

    const studentId = localStorage.getItem('studentId') || '262001';
    document.getElementById('userAvatarTop').textContent = studentId.slice(-2);

    function loadAssignments() {
        const container = document.getElementById('assignmentsContainer');
        const assignments = JSON.parse(localStorage.getItem('assignments') || '[]');

        if (assignments.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📋</div>
                    <p>No assignments available yet.</p>
                </div>`;
            return;
        }

        // Group by course
        const courses = {};
        assignments.forEach(a => {
            const course = a.course || 'General';
            if (!courses[course]) courses[course] = [];
            courses[course].push(a);
        });

        let html = '';
        Object.keys(courses).forEach((course, ci) => {
            const items = courses[course];
            html += `
                <div class="course-section" style="animation-delay:${ci*0.1}s">
                    <div class="course-header" onclick="toggleCourse(${ci})">
                        <span>${course}</span>
                        <span id="courseArrow-${ci}">∨</span>
                    </div>
                    <div class="course-body" id="courseBody-${ci}">
                        <p class="course-intro">Below are the assignments for the course: <strong>${course}</strong></p>`;

            items.forEach((a, ai) => {
                const key = `${ci}-${ai}`;
                const submissions = JSON.parse(localStorage.getItem('submissions') || '{}');
                const submitted = submissions[studentId] && submissions[studentId][a.id];

                html += `
                    <div class="assignment-item">
                        <div class="assignment-header" onclick="toggleAssignment('${key}')">
                            <span>${a.title}</span>
                            <span id="assignArrow-${key}">∨</span>
                        </div>
                        <div class="assignment-body" id="assignBody-${key}">
                            <div class="assignment-meta">
                                Released on ${a.date}<br>
                                Deadline: <span class="deadline">${a.deadline || 'N/A'}</span><br>
                                ${a.link ? `Assignment <a href="${a.link}" target="_blank">click here</a>` : ''}
                            </div>
                            ${submitted ? `
                                <div class="submitted-badge">
                                    <span>✅ Assignment has been submitted.</span>
                                    <span style="color:#dc2626;cursor:pointer;" onclick="deleteSubmission('${a.id}')">🗑</span>
                                </div>` : `
                                <button onclick="submitAssignment('${a.id}')" style="background:var(--teal);color:white;border:none;padding:9px 18px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;margin-top:10px;">
                                    Submit Assignment
                                </button>`}
                        </div>
                    </div>`;
            });

            html += `</div></div>`;
        });

        container.innerHTML = html;
    }

    function toggleCourse(ci) {
        const body = document.getElementById('courseBody-' + ci);
        const arrow = document.getElementById('courseArrow-' + ci);
        body.classList.toggle('show');
        arrow.textContent = body.classList.contains('show') ? '∧' : '∨';
    }

    function toggleAssignment(key) {
        const body = document.getElementById('assignBody-' + key);
        const arrow = document.getElementById('assignArrow-' + key);
        body.classList.toggle('show');
        arrow.textContent = body.classList.contains('show') ? '∧' : '∨';
    }

    function submitAssignment(assignId) {
        let submissions = JSON.parse(localStorage.getItem('submissions') || '{}');
        if (!submissions[studentId]) submissions[studentId] = {};
        submissions[studentId][assignId] = { date: new Date().toLocaleDateString() };
        localStorage.setItem('submissions', JSON.stringify(submissions));
        loadAssignments();
    }

    function deleteSubmission(assignId) {
        let submissions = JSON.parse(localStorage.getItem('submissions') || '{}');
        if (submissions[studentId]) delete submissions[studentId][assignId];
        localStorage.setItem('submissions', JSON.stringify(submissions));
        loadAssignments();
    }

    loadAssignments();
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
    function logout() { localStorage.removeItem('userType'); }
</script>
<script src="../js/storage.js"></script>
</body>
</html>
