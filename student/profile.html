<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile - ENG: Gamal Elmzayen</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        :root { --teal: #0d7b6e; --teal-dark: #1a5f5f; --teal-light: #e8f5f3; --sidebar-width: 240px; --header-height: 60px; }
        html, body { width: 100%; min-height: 100vh; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
        body { background: #f5f6fa; display: flex; }
        .top-header { position: fixed; top: 0; left: 0; right: 0; height: var(--header-height); background: var(--teal-dark); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 1000; }
        .header-logo { display: flex; align-items: center; gap: 12px; }
        .logo-mark { width: 38px; height: 38px; background: rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px; }
        .header-logo span { color: white; font-weight: 700; font-size: 15px; }
        .hamburger { display: none; background: none; border: none; color: white; font-size: 22px; cursor: pointer; }
        .header-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--teal), #2d9e7a); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 16px; border: 2px solid rgba(255,255,255,0.3); overflow: hidden; cursor: pointer; }
        .header-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .sidebar { position: fixed; top: var(--header-height); left: 0; width: var(--sidebar-width); height: calc(100vh - var(--header-height)); background: white; border-right: 1px solid #e5e7eb; overflow-y: auto; z-index: 900; padding: 20px 0; transition: transform 0.3s; }
        .menu-section { padding: 0 16px; margin-bottom: 8px; }
        .menu-label { font-size: 11px; font-weight: 700; color: #9ca3af; letter-spacing: 1px; text-transform: uppercase; padding: 12px 8px 6px; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: #4b5563; text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 500; transition: all 0.2s; position: relative; }
        .nav-link:hover, .nav-link.active { background: var(--teal-light); color: var(--teal); }
        .nav-link.active { font-weight: 600; }
        .nav-link.active::after { content: ''; position: absolute; right: 10px; width: 8px; height: 8px; background: var(--teal); border-radius: 50%; }
        .nav-icon { font-size: 18px; width: 22px; text-align: center; }
        .nav-divider { height: 1px; background: #f3f4f6; margin: 12px 16px; }
        .sidebar-logout { display: flex; align-items: center; gap: 12px; padding: 10px 28px; color: #6b7280; cursor: pointer; font-size: 14px; border: none; background: none; width: 100%; }
        .sidebar-logout:hover { color: #ef4444; }
        .main-content { margin-left: var(--sidebar-width); margin-top: var(--header-height); flex: 1; padding: 30px; animation: fadeInPage 0.4s ease-out; }
        @keyframes fadeInPage { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .separator { height: 1px; background: #e5e7eb; margin-bottom: 25px; }
        .profile-top { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 30px; margin-bottom: 20px; animation: slideIn 0.4s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-15px); } to { opacity: 1; transform: translateX(0); } }
        .profile-header { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
        .avatar-wrapper { position: relative; width: 90px; height: 90px; flex-shrink: 0; cursor: pointer; }
        .profile-avatar-large { width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, var(--teal), #2d9e7a); display: flex; align-items: center; justify-content: center; color: white; font-size: 34px; font-weight: bold; overflow: hidden; border: 3px solid var(--teal-light); }
        .profile-avatar-large img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
        .avatar-edit-overlay { position: absolute; inset: 0; border-radius: 50%; background: rgba(0, 0, 0, 0.45); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; opacity: 0; transition: opacity 0.25s; cursor: pointer; }
        .avatar-wrapper:hover .avatar-edit-overlay { opacity: 1; }
        .avatar-edit-overlay span { color: white; font-size: 20px; line-height: 1; }
        .avatar-edit-overlay p { color: white; font-size: 10px; font-weight: 600; }
        #avatarInput { display: none; }
        .upload-progress { display: none; position: absolute; inset: 0; border-radius: 50%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; flex-direction: column; gap: 5px; }
        .upload-progress.show { display: flex; }
        .spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .upload-progress p { color: white; font-size: 10px; font-weight: 600; }
        .profile-name-section { flex: 1; }
        .profile-name-section h2 { font-size: 22px; font-weight: 800; color: #111827; margin-bottom: 5px; }
        .profile-name-section .email-text { color: #6b7280; font-size: 13px; margin-bottom: 3px; }
        .profile-name-section .created-text { color: #9ca3af; font-size: 12px; }
        .btn-group { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
                .change-photo-btn { display: inline-flex; align-items: center; gap: 7px; background: var(--teal-light); color: var(--teal); border: 1px solid var(--teal); border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .change-photo-btn:hover { background: var(--teal); color: white; }
        .remove-photo-btn { display: none; align-items: center; gap: 7px; background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .remove-photo-btn.show { display: inline-flex; }
        .remove-photo-btn:hover { background: #fca5a5; }
        .toast { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(80px); background: #111827; color: white; padding: 12px 24px; border-radius: 10px; font-size: 14px; font-weight: 500; z-index: 9999; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); white-space: nowrap; box-shadow: 0 8px 25px rgba(0,0,0,0.25); }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { background: #065f46; }
        .toast.error { background: #991b1b; }
        .info-section { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 28px; margin-bottom: 20px; animation: slideIn 0.5s ease-out both; }
        .info-section h3 { font-size: 18px; font-weight: 800; color: #111827; margin-bottom: 20px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .info-field label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 7px; }
        .info-field input { width: 100%; padding: 11px 14px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 14px; color: #111827; background: white; transition: all 0.2s; outline: none; }
        .info-field input:focus { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(13, 123, 110, 0.1); }
        .info-field input[readonly] { background: #f9fafb; color: #6b7280; cursor: not-allowed; }
        .save-btn { background: #2563eb; color: white; border: none; border-radius: 8px; padding: 11px 28px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 5px; transition: all 0.2s; }
        .save-btn:hover { background: #1d4ed8; transform: translateY(-1px); }
        .file-warning { background: #fffbeb; border: 1px solid #fcd34d; color: #92400e; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 10px; display: none; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 850; }
        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .sidebar.open { transform: translateX(0); } .main-content { margin-left: 0; padding: 20px 15px; } .hamburger { display: block; } .overlay.show { display: block; } .info-grid { grid-template-columns: 1fr; } .profile-header { flex-direction: column; align-items: flex-start; } }
    </style>
</head>
<body>
    <header class="top-header">
        <div class="header-logo">
            <button class="hamburger" onclick="toggleSidebar()">☰</button>
            <div class="logo-mark">G</div>
            <span>ENG: Gamal Elmzayen</span>
        </div>
        <div class="header-avatar" id="headerAvatar" onclick="triggerUpload()"></div>
    </header>
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="menu-section">
            <div class="menu-label">Main Menu</div>
            <a href="home.html" class="nav-link"><span class="nav-icon">🏠</span> Home</a>
            <a href="lectures.html" class="nav-link"><span class="nav-icon">📚</span> Lectures</a>
            <a href="profile.html" class="nav-link active"><span class="nav-icon">👤</span> Profile</a>
            <a href="results.html" class="nav-link"><span class="nav-icon">📋</span> My Results</a>
            <a href="timetable.html" class="nav-link"><span class="nav-icon">📅</span> Timetables</a>
        </div>
        <div class="nav-divider"></div>
        <div class="menu-section">
            <div class="menu-label">Activities</div>
            <a href="sheets.html" class="nav-link"><span class="nav-icon">📄</span> Sheets</a>
            <a href="assignments.html" class="nav-link"><span class="nav-icon">📝</span> Assignments</a>
            <a href="quizzes.html" class="nav-link"><span class="nav-icon">❓</span> Quizzes</a>
        </div>
        <div class="nav-divider"></div>
        <button class="sidebar-logout" onclick="logout()"><span>🚪</span> Logout</button>
    </aside>
    <main class="main-content">
        <div class="separator"></div>
        <div class="profile-top">
            <div class="profile-header">
                <div class="avatar-wrapper" onclick="triggerUpload()">
                    <div class="profile-avatar-large" id="bigAvatarCircle"><span id="bigAvatarText">S</span></div>
                    <div class="avatar-edit-overlay"><span>📷</span><p>Change Photo</p></div>
                    <div class="upload-progress" id="uploadProgress"><div class="spinner"></div><p>Uploading...</p></div>
                </div>
                <input type="file" id="avatarInput" accept="image/jpeg,image/png,image/gif,image/webp" onchange="handleAvatarChange(event)">
                <div class="profile-name-section">
                    <h2 id="profileName">Student</h2>
                    <p class="email-text" id="profileEmail"></p>
                    <p class="created-text" id="profileCreated">account created: 2024-01-01</p>
                    <div class="btn-group">
                        <button class="remove-photo-btn" id="removePhotoBtn" onclick="removePhoto()">🗑 Remove Photo</button>
                        <button class="change-photo-btn" onclick="triggerUpload()">📷 Change Photo</button>
                    </div>
                    <div class="file-warning" id="fileWarning">⚠️ File is too large! Please choose an image under 5MB.</div>
                </div>
            </div>
        </div>
        <div class="info-section">
            <h3>General information</h3>
            <div class="info-grid">
                <div class="info-field"><label>Name</label><input type="text" id="nameInput" placeholder="Your full name"></div>
                <div class="info-field"><label>Phone</label><input type="tel" id="phoneInput" placeholder="+20 (1XX) XXX-XXXX"></div>
                <div class="info-field"><label>Email</label><input type="email" id="emailInput" readonly></div>
                <div class="info-field"><label>Student ID</label><input type="text" id="idInput" readonly></div>
                <div class="info-field"><label>Program</label><input type="text" id="programInput" value="Information Technology"></div>
                <div class="info-field"><label>Academic Year</label><input type="text" id="yearInput" value="2025-2026"></div>
            </div>
            <button class="save-btn" onclick="saveProfile()">Save Changes</button>
        </div>
    </main>
    <div class="toast" id="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/cloud.js"></script>
    <script src="../js/avatar.js"></script>
    <script>
        if (!localStorage.getItem('userType') || localStorage.getItem('userType') !== 'student') window.location.href = '../index.html';

        const studentId = localStorage.getItem('studentId') || '262001';
        const studentEmail = localStorage.getItem('userEmail') || studentId + '@codetech.com';
        const PROFILE_KEY = 'profile_' + studentId;

        function init() {
            document.getElementById('profileEmail').textContent = studentEmail;
            document.getElementById('emailInput').value = studentEmail;
            document.getElementById('idInput').value = studentId;
            document.getElementById('profileCreated').textContent = 'account created: ' + new Date().toLocaleDateString();
            const saved = JSON.parse(localStorage.getItem(PROFILE_KEY) || '{}');
            if (saved.name) {
                document.getElementById('nameInput').value = saved.name;
                document.getElementById('profileName').textContent = saved.name;
            } else {
                document.getElementById('profileName').textContent = 'Student ' + studentId;
            }
            if (saved.phone) document.getElementById('phoneInput').value = saved.phone;
            if (saved.program) document.getElementById('programInput').value = saved.program;
            if (saved.year) document.getElementById('yearInput').value = saved.year;
            if (localStorage.getItem('avatar_' + studentId)) {
                document.getElementById('removePhotoBtn').classList.add('show');
            }
        }

        function triggerUpload() { document.getElementById('avatarInput').click(); }

        function handleAvatarChange(event) {
            const file = event.target.files[0];
            if (!file) return;
            document.getElementById('fileWarning').style.display = 'none';
            const validTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
            if (!validTypes.includes(file.type)) { showToast('❌ Please choose a valid image', 'error'); return; }
            if (file.size > 5 * 1024 * 1024) {
                document.getElementById('fileWarning').style.display = 'block';
                showToast('❌ Image too large! Max 5MB', 'error'); return;
            }
            showUploadProgress(true);
            const reader = new FileReader();
            reader.onload = function(e) {
                setTimeout(() => {
                    try {
                        AvatarManager.savePhoto(e.target.result);
                        document.getElementById('removePhotoBtn').classList.add('show');
                        showUploadProgress(false);
                        showToast('✅ Photo updated on all devices!', 'success');
                    } catch(err) {
                        showUploadProgress(false);
                        showToast('❌ Storage full!', 'error');
                    }
                }, 800);
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function removePhoto() {
            if (!confirm('Remove your profile photo?')) return;
            AvatarManager.removePhoto();
            document.getElementById('removePhotoBtn').classList.remove('show');
            showToast('🗑 Photo removed', 'success');
        }

        function showUploadProgress(show) { document.getElementById('uploadProgress').classList.toggle('show', show); }

        function saveProfile() {
            const profileData = {
                name: document.getElementById('nameInput').value,
                phone: document.getElementById('phoneInput').value,
                program: document.getElementById('programInput').value,
                year: document.getElementById('yearInput').value
            };
            localStorage.setItem(PROFILE_KEY, JSON.stringify(profileData));
            document.getElementById('profileName').textContent = profileData.name || 'Student ' + studentId;
            showToast('✅ Profile saved!', 'success');
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('show'); }
        function logout() { localStorage.removeItem('userType'); localStorage.removeItem('studentId'); localStorage.removeItem('userEmail'); window.location.href = '../index.html'; }

        init();
    </script>
</body>
</html>
