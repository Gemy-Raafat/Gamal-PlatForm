<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lectures - Gamal Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        :root { --teal: #1a7a65; --teal-dark: #0d5c4a; --teal-light: #e8f5f1; --sidebar-w: 240px; --header-h: 60px; }
        body { background: #f5f6f8; display: flex; flex-direction: column; min-height: 100vh; }

        .top-header { position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); background: var(--teal); display: flex; align-items: center; justify-content: space-between; padding: 0 20px 0 0; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .header-logo { display: flex; align-items: center; gap: 10px; padding: 0 20px; }
        .header-logo .logo-square { width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .header-logo span { color: white; font-size: 13px; font-weight: 600; line-height: 1.3; }
        .user-avatar { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.3); border: 2px solid rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px; }
        .menu-toggle { display: none; background: none; border: none; color: white; font-size: 22px; cursor: pointer; padding: 5px 15px; }

        .layout { display: flex; margin-top: var(--header-h); min-height: calc(100vh - var(--header-h)); }

        .sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #e8e8e8; position: fixed; top: var(--header-h); left: 0; height: calc(100vh - var(--header-h)); overflow-y: auto; padding: 20px 0; z-index: 900; transition: transform 0.3s; }
        .sidebar-section-title { font-size: 11px; font-weight: 700; color: #999; letter-spacing: 1px; padding: 8px 20px 4px; text-transform: uppercase; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 20px; color: #555; text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.2s; position: relative; cursor: pointer; }
        .nav-item:hover { color: var(--teal); background: var(--teal-light); }
        .nav-item.active { color: var(--teal); background: var(--teal-light); font-weight: 600; }
        .nav-item.active::after { content: '•'; position: absolute; right: 15px; color: var(--teal); font-size: 20px; }
        .nav-divider { height: 1px; background: #f0f0f0; margin: 10px 20px; }

        .main-content { margin-left: var(--sidebar-w); flex: 1; padding: 30px; }
        .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #888; margin-bottom: 12px; }
        .breadcrumb a { color: #888; text-decoration: none; }
        .page-title { font-size: 32px; font-weight: 800; color: #1a1a2e; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }

        /* Week Cards */
        .week-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 20px 25px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.3s;
            animation: fadeInUp 0.4s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .week-card:hover { box-shadow: 0 4px 15px rgba(0,0,0,0.08); transform: translateY(-2px); }

        .week-left { display: flex; align-items: center; gap: 14px; }
        .week-icon { color: var(--teal); font-size: 22px; }
        .week-title { font-size: 16px; font-weight: 700; color: #1a1a2e; }
        .week-sub { font-size: 13px; color: #888; margin-top: 3px; }

        .view-btn {
            background: var(--teal);
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .view-btn:hover { background: var(--teal-dark); }

        /* Materials Accordion */
        .materials-section {
            background: white;
            border: 1px solid #eee;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .material-item {
            border-bottom: 1px solid #f0f0f0;
        }

        .material-item:last-child { border-bottom: none; }

        .material-header {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.2s;
        }

        .material-header:hover { background: #fafafa; }

        .material-left { display: flex; align-items: center; gap: 10px; }

        .material-title { font-size: 14px; font-weight: 600; color: #1a1a2e; }

        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-file { background: #dbeafe; color: #1e40af; }
        .badge-link { background: #dcfce7; color: #166534; }

        .material-date { font-size: 12px; color: #999; display: flex; align-items: center; gap: 5px; }

        .material-body {
            padding: 15px 20px;
            background: #fafafa;
            border-top: 1px solid #f0f0f0;
            display: none;
        }

        .material-body.show { display: block; animation: slideDown 0.3s; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .material-link {
            font-size: 14px;
            color: #555;
        }

        .material-link a { color: #1d4ed8; text-decoration: none; font-weight: 600; }
        .material-link a:hover { text-decoration: underline; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #aaa;
        }

        .empty-state .empty-icon { font-size: 48px; margin-bottom: 15px; }
        .empty-state p { font-size: 16px; }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            background: var(--teal);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 20px;
            transition: all 0.2s;
        }

        .back-btn:hover { background: var(--teal-dark); }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 20px 15px; }
            .menu-toggle { display: block; }
            .page-title { font-size: 24px; }
            .week-card { flex-direction: column; align-items: flex-start; gap: 12px; }
        }
    </style>
</head>
<body>

<header class="top-header">
    <div class="header-logo">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <div class="logo-square">🎓</div>
        <span>ENG: Gamal<br>Elmzayen Portal</span>
    </div>
    <div style="padding-right:10px">
        <div class="user-avatar" id="userAvatarTop">G</div>
    </div>
</header>

<div class="layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">
            <p class="sidebar-section-title">Main Menu</p>
            <a href="home.html" class="nav-item"><span>🏠</span> Home</a>
            <a href="lectures.html" class="nav-item active"><span>📚</span> Lectures</a>
            <a href="profile.html" class="nav-item"><span>👤</span> Profile</a>
        </div>
        <div class="nav-divider"></div>
        <div class="sidebar-section">
            <p class="sidebar-section-title">Activities</p>
            <a href="results.html" class="nav-item"><span>📊</span> Results</a>
            <a href="assignments.html" class="nav-item"><span>📋</span> Assignments</a>
            <a href="timetable.html" class="nav-item"><span>📅</span> Timetables</a>
            <a href="quizzes.html" class="nav-item"><span>❓</span> Quizzes</a>
            <a href="sheets.html" class="nav-item"><span>📄</span> Sheets</a>
        </div>
        <div class="nav-divider"></div>
        <a href="../index.html" class="nav-item" onclick="logout()" style="color:#e53e3e;"><span>🚪</span> Logout</a>
    </aside>

    <main class="main-content">
        <div class="breadcrumb">
            <a href="home.html">🏠</a>
            <span class="sep">›</span>
            <span id="breadcrumbText">Lectures</span>
        </div>

        <div id="pageContent"></div>
    </main>
</div>

<script>
    if (!localStorage.getItem('userType') || localStorage.getItem('userType') !== 'student') {
        window.location.href = '../index.html';
    }

    const studentId = localStorage.getItem('studentId') || '262001';
    document.getElementById('userAvatarTop').textContent = studentId.slice(-2);

    // View state: 'weeks' | 'materials'
    let currentView = 'weeks';
    let selectedWeek = null;

    function renderView() {
        const container = document.getElementById('pageContent');
        const lectures = JSON.parse(localStorage.getItem('lectures') || '[]');

        if (currentView === 'weeks') {
            document.getElementById('breadcrumbText').textContent = 'Lectures';

            // Group by week/lectureNum
            const weeks = {};
            lectures.forEach(l => {
                const w = l.week || 'Week ' + l.lectureNum;
                if (!weeks[w]) weeks[w] = [];
                weeks[w].push(l);
            });

            if (lectures.length === 0) {
                container.innerHTML = `
                    <h1 class="page-title">Lectures</h1>
                    <div class="empty-state">
                        <div class="empty-icon">📚</div>
                        <p>No lectures available yet.</p>
                    </div>`;
                return;
            }

            let html = '<h1 class="page-title">Lectures</h1>';
            Object.keys(weeks).forEach((weekName, i) => {
                const items = weeks[weekName];
                html += `
                    <div class="week-card" style="animation-delay:${i*0.1}s">
                        <div class="week-left">
                            <span class="week-icon">📅</span>
                            <div>
                                <div class="week-title">${weekName}</div>
                                <div class="week-sub">${items[0].description || ''}</div>
                            </div>
                        </div>
                        <button class="view-btn" onclick="showMaterials('${weekName}')">View Materials</button>
                    </div>`;
            });

            container.innerHTML = html;

        } else if (currentView === 'materials') {
            const weekLectures = lectures.filter(l => (l.week || 'Week ' + l.lectureNum) === selectedWeek);
            document.getElementById('breadcrumbText').textContent = 'Lectures › ' + selectedWeek;

            let html = `
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
                    <h1 class="page-title" style="margin:0;border:none;padding:0;">${selectedWeek}</h1>
                    <button class="view-btn" onclick="goBack()" style="background:#555;">List all weeks</button>
                </div>
                <div class="materials-section">`;

            weekLectures.forEach((l, i) => {
                html += `
                    <div class="material-item">
                        <div class="material-header" onclick="toggleMaterial(${i})">
                            <div class="material-left">
                                <span class="material-title">Lecture ${l.lectureNum} - ${l.title}</span>
                                <span class="badge badge-file">File</span>
                                <span class="material-date">📅 ${l.date}</span>
                            </div>
                            <span id="arrow-${i}">∨</span>
                        </div>
                        <div class="material-body" id="body-${i}">
                            <div class="material-link">
                                Lecture ${l.lectureNum} - 
                                ${l.videoUrl ? `<a href="${l.videoUrl}" target="_blank">click here</a>` : '<span style="color:#aaa">No link provided</span>'}
                            </div>
                            ${l.description ? `<p style="margin-top:10px;font-size:13px;color:#666;">${l.description}</p>` : ''}
                        </div>
                    </div>`;
            });

            html += '</div>';
            container.innerHTML = html;
        }
    }

    function showMaterials(weekName) {
        currentView = 'materials';
        selectedWeek = weekName;
        renderView();
    }

    function goBack() {
        currentView = 'weeks';
        selectedWeek = null;
        renderView();
    }

    function toggleMaterial(i) {
        const body = document.getElementById('body-' + i);
        const arrow = document.getElementById('arrow-' + i);
        body.classList.toggle('show');
        arrow.textContent = body.classList.contains('show') ? '∧' : '∨';
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
    }

    function logout() {
        localStorage.removeItem('userType');
    }

    renderView();
</script>
<script src="../js/storage.js"></script>
</body>
</html>
