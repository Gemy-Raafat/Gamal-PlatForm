<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizzes - Gamal Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        :root { --teal: #1a7a65; --teal-dark: #0d5c4a; --teal-light: #e8f5f1; --sidebar-w: 240px; --header-h: 60px; }
        body { background: #f5f6f8; display: flex; flex-direction: column; min-height: 100vh; }

        .top-header { position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); background: var(--teal); display: flex; align-items: center; justify-content: space-between; padding: 0 20px 0 0; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .header-logo { display: flex; align-items: center; gap: 10px; padding: 0 20px; }
        .header-logo .logo-square { width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .header-logo span { color: white; font-size: 13px; font-weight: 600; line-height: 1.3; }
        .user-avatar { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.3); border: 2px solid rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px; }
        .menu-toggle { display: none; background: none; border: none; color: white; font-size: 22px; cursor: pointer; padding: 5px 15px; }

        .layout { display: flex; margin-top: var(--header-h); min-height: calc(100vh - var(--header-h)); }
        .sidebar { width: var(--sidebar-w); background: white; border-right: 1px solid #e8e8e8; position: fixed; top: var(--header-h); left: 0; height: calc(100vh - var(--header-h)); overflow-y: auto; padding: 20px 0; z-index: 900; transition: transform 0.3s; }
        .sidebar-section-title { font-size: 11px; font-weight: 700; color: #999; letter-spacing: 1px; padding: 8px 20px 4px; text-transform: uppercase; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 20px; color: #555; text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.2s; position: relative; cursor: pointer; }
        .nav-item:hover { color: var(--teal); background: var(--teal-light); }
        .nav-item.active { color: var(--teal); background: var(--teal-light); font-weight: 600; }
        .nav-item.active::after { content: '•'; position: absolute; right: 15px; color: var(--teal); font-size: 20px; }
        .nav-divider { height: 1px; background: #f0f0f0; margin: 10px 20px; }

        .main-content { margin-left: var(--sidebar-w); flex: 1; padding: 30px; }
        .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #888; margin-bottom: 12px; }
        .page-title { font-size: 32px; font-weight: 800; color: #1a1a2e; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }

        .quiz-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 10px;
            margin-bottom: 12px;
            overflow: hidden;
            animation: fadeInUp 0.4s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .quiz-header {
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .quiz-left h4 { font-size: 16px; font-weight: 700; color: #1a1a2e; margin-bottom: 5px; }
        .quiz-meta { font-size: 12px; color: #888; display: flex; gap: 12px; flex-wrap: wrap; }
        .quiz-meta span { display: flex; align-items: center; gap: 4px; }

        .quiz-actions { display: flex; gap: 10px; }

        .quiz-badge {
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-upcoming { background: #fff7ed; color: #c2410c; }
        .badge-done { background: #dcfce7; color: #166534; }

        .start-quiz-btn {
            background: var(--teal);
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .start-quiz-btn:hover { background: var(--teal-dark); }

        /* Quiz Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.show { display: flex; }

        .modal-box {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { font-size: 20px; font-weight: 700; color: #1a1a2e; }
        .close-modal { background: none; border: none; font-size: 22px; cursor: pointer; color: #888; }

        .question-item { margin-bottom: 20px; }
        .question-text { font-size: 15px; font-weight: 600; color: #1a1a2e; margin-bottom: 10px; }
        .options { display: flex; flex-direction: column; gap: 8px; }

        .option-label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border: 1.5px solid #eee;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .option-label:hover { border-color: var(--teal); background: var(--teal-light); }
        .option-label input { accent-color: var(--teal); }

        .submit-quiz-btn {
            width: 100%;
            padding: 14px;
            background: var(--teal);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
        }

        .submit-quiz-btn:hover { background: var(--teal-dark); }

        .quiz-result {
            text-align: center;
            padding: 30px;
        }

        .result-score { font-size: 48px; font-weight: 800; color: var(--teal); }
        .result-text { font-size: 16px; color: #666; margin-top: 10px; }

        .empty-state { text-align: center; padding: 60px 20px; color: #aaa; }
        .empty-icon { font-size: 48px; margin-bottom: 15px; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 20px 15px; }
            .menu-toggle { display: block; }
            .page-title { font-size: 24px; }
            .quiz-header { flex-direction: column; align-items: flex-start; gap: 12px; }
        }
    </style>
</head>
<body>

<header class="top-header">
    <div class="header-logo">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <div class="logo-square">🎓</div>
        <span>ENG: Gamal<br>Elmzayen Portal</span>
    </div>
    <div style="padding-right:10px">
        <div class="user-avatar" id="userAvatarTop">G</div>
    </div>
</header>

<div class="layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">
            <p class="sidebar-section-title">Main Menu</p>
            <a href="home.html" class="nav-item"><span>🏠</span> Home</a>
            <a href="lectures.html" class="nav-item"><span>📚</span> Lectures</a>
            <a href="profile.html" class="nav-item"><span>👤</span> Profile</a>
        </div>
        <div class="nav-divider"></div>
        <div class="sidebar-section">
            <p class="sidebar-section-title">Activities</p>
            <a href="results.html" class="nav-item"><span>📊</span> Results</a>
            <a href="assignments.html" class="nav-item"><span>📋</span> Assignments</a>
            <a href="timetable.html" class="nav-item"><span>📅</span> Timetables</a>
            <a href="quizzes.html" class="nav-item active"><span>❓</span> Quizzes</a>
            <a href="sheets.html" class="nav-item"><span>📄</span> Sheets</a>
        </div>
        <div class="nav-divider"></div>
        <a href="../index.html" class="nav-item" onclick="logout()" style="color:#e53e3e;"><span>🚪</span> Logout</a>
    </aside>

    <main class="main-content">
        <div class="breadcrumb">
            <a href="home.html">🏠</a> <span>›</span> <span>Quizzes</span>
        </div>
        <h1 class="page-title">Quizzes</h1>
        <div id="quizzesContainer"></div>
    </main>
</div>

<!-- Quiz Modal -->
<div class="modal-overlay" id="quizModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="quizModalTitle">Quiz</h3>
            <button class="close-modal" onclick="closeQuizModal()">✕</button>
        </div>
        <div id="quizModalBody"></div>
    </div>
</div>

<script>
    if (!localStorage.getItem('userType') || localStorage.getItem('userType') !== 'student') {
        window.location.href = '../index.html';
    }

    const studentId = localStorage.getItem('studentId') || '262001';
    document.getElementById('userAvatarTop').textContent = studentId.slice(-2);

    let currentQuiz = null;

    function loadQuizzes() {
        const container = document.getElementById('quizzesContainer');
        const quizzes = JSON.parse(localStorage.getItem('quizzes') || '[]');

        if (quizzes.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">❓</div>
                    <p>No quizzes available yet.</p>
                </div>`;
            return;
        }

        const quizResults = JSON.parse(localStorage.getItem('quizResults_' + studentId) || '{}');

        let html = '';
        quizzes.forEach((quiz, i) => {
            const done = quizResults[quiz.id];
            html += `
                <div class="quiz-card" style="animation-delay:${i*0.1}s">
                    <div class="quiz-header">
                        <div class="quiz-left">
                            <h4>${quiz.title}</h4>
                            <div class="quiz-meta">
                                <span>📅 ${quiz.date}</span>
                                <span>⏱ ${quiz.duration || 30} min</span>
                                <span>📝 ${quiz.questions ? quiz.questions.length : 0} questions</span>
                                ${done ? `<span>✅ Score: ${done.score}/${done.total}</span>` : ''}
                            </div>
                        </div>
                        <div class="quiz-actions">
                            <span class="quiz-badge ${done ? 'badge-done' : 'badge-upcoming'}">${done ? 'Completed' : 'Available'}</span>
                            ${!done && quiz.questions && quiz.questions.length > 0 ?
                                `<button class="start-quiz-btn" onclick="startQuiz(${i})">Start Quiz</button>` : ''}
                            ${done ? `<button class="start-quiz-btn" style="background:#888;" onclick="viewResult(${i})">View Result</button>` : ''}
                        </div>
                    </div>
                </div>`;
        });

        container.innerHTML = html;
    }

    function startQuiz(index) {
        const quizzes = JSON.parse(localStorage.getItem('quizzes') || '[]');
        currentQuiz = quizzes[index];

        document.getElementById('quizModalTitle').textContent = currentQuiz.title;

        let html = '';
        currentQuiz.questions.forEach((q, qi) => {
            html += `
                <div class="question-item">
                    <div class="question-text">${qi + 1}. ${q.question}</div>
                    <div class="options">`;
            q.options.forEach((opt, oi) => {
                html += `
                    <label class="option-label">
                        <input type="radio" name="q${qi}" value="${oi}">
                        ${opt}
                    </label>`;
            });
            html += '</div></div>';
        });

        html += `<button class="submit-quiz-btn" onclick="submitQuiz()">Submit Quiz</button>`;

        document.getElementById('quizModalBody').innerHTML = html;
        document.getElementById('quizModal').classList.add('show');
    }

    function submitQuiz() {
        if (!currentQuiz) return;

        let score = 0;
        const total = currentQuiz.questions.length;

        currentQuiz.questions.forEach((q, qi) => {
            const selected = document.querySelector(`input[name="q${qi}"]:checked`);
            if (selected && parseInt(selected.value) === q.correctIndex) score++;
        });

        // Save result
        let results = JSON.parse(localStorage.getItem('quizResults_' + studentId) || '{}');
        results[currentQuiz.id] = { score, total, date: new Date().toLocaleDateString() };
        localStorage.setItem('quizResults_' + studentId, JSON.stringify(results));

        // Show result
        const percentage = Math.round((score / total) * 100);
        document.getElementById('quizModalBody').innerHTML = `
            <div class="quiz-result">
                <div class="result-score">${percentage}%</div>
                <div class="result-text">You scored <strong>${score}/${total}</strong></div>
                <div style="margin-top:20px;color:${percentage>=60?'#166534':'#dc2626'};font-size:18px;font-weight:700;">
                    ${percentage >= 60 ? '🎉 Pass!' : '❌ Try again!'}
                </div>
                <button class="submit-quiz-btn" onclick="closeQuizModal()" style="margin-top:20px;">Close</button>
            </div>`;

        loadQuizzes();
    }

    function viewResult(index) {
        const quizzes = JSON.parse(localStorage.getItem('quizzes') || '[]');
        const quiz = quizzes[index];
        const results = JSON.parse(localStorage.getItem('quizResults_' + studentId) || '{}');
        const result = results[quiz.id];

        if (result) {
            document.getElementById('quizModalTitle').textContent = quiz.title + ' - Result';
            const percentage = Math.round((result.score / result.total) * 100);
            document.getElementById('quizModalBody').innerHTML = `
                <div class="quiz-result">
                    <div class="result-score">${percentage}%</div>
                    <div class="result-text">You scored <strong>${result.score}/${result.total}</strong></div>
                    <div style="margin-top:20px;color:${percentage>=60?'#166534':'#dc2626'};font-size:18px;font-weight:700;">
                        ${percentage >= 60 ? '🎉 Pass!' : '❌ Below average'}
                    </div>
                    <button class="submit-quiz-btn" onclick="closeQuizModal()" style="margin-top:20px;">Close</button>
                </div>`;
            document.getElementById('quizModal').classList.add('show');
        }
    }

    function closeQuizModal() {
        document.getElementById('quizModal').classList.remove('show');
        currentQuiz = null;
    }

    loadQuizzes();
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
    function logout() { localStorage.removeItem('userType'); }
</script>
<script src="../js/storage.js"></script>
</body>
</html>
