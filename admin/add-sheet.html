<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Sheet - Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        :root { --teal: #1a7a65; --teal-dark: #0d5c4a; --teal-light: #e8f5f1; }
        body { background: #f5f6f8; min-height: 100vh; }
        .admin-header { background: var(--teal); padding: 0 30px; height: 60px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .back-btn { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 7px 15px; border-radius: 7px; cursor: pointer; font-size: 13px; text-decoration: none; }
        .admin-header h2 { color: white; font-size: 18px; font-weight: 700; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .form-card { background: white; border: 1px solid #eee; border-radius: 12px; padding: 30px; margin-bottom: 25px; animation: fadeInUp 0.5s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .form-card h3 { font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .form-grid .full { grid-column: 1 / -1; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 7px; }
        .form-group input, .form-group textarea { width: 100%; padding: 11px 14px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 14px; color: #333; transition: all 0.2s; outline: none; }
        .form-group input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(26,122,101,0.1); }
        .submit-btn { background: var(--teal); color: white; border: none; padding: 13px 30px; border-radius: 9px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: 10px; }
        .submit-btn:hover { background: var(--teal-dark); transform: translateY(-2px); }
        .success-toast { background: #dcfce7; color: #166534; padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; border: 1px solid #bbf7d0; display: none; }
        .sheet-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #f0f0f0; gap: 10px; }
        .sheet-row:last-child { border-bottom: none; }
        .sheet-info h4 { font-size: 14px; font-weight: 600; color: #1a1a2e; margin-bottom: 3px; }
        .sheet-info p { font-size: 12px; color: #888; }
        .delete-btn { background: #fee2e2; color: #dc2626; border: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .delete-btn:hover { background: #dc2626; color: white; }
        .empty-msg { text-align: center; padding: 30px; color: #aaa; font-size: 14px; }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } .container { padding: 0 15px; } }
    </style>
</head>
<body>
<header class="admin-header">
    <div style="display:flex;align-items:center;gap:12px;">
        <a href="index.html" class="back-btn">← Back</a>
        <h2>📄 Add Sheet</h2>
    </div>
    <span style="color:rgba(255,255,255,0.7);font-size:13px;">Admin Panel</span>
</header>
<div class="container">
    <div class="form-card">
        <h3>📄 Add New Sheet</h3>
        <div class="success-toast" id="successToast">✅ Sheet saved!</div>
        <form id="sheetForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>Sheet Title *</label>
                    <input type="text" id="title" required placeholder="e.g., Arrays & Loops">
                </div>
                <div class="form-group">
                    <label>Sheet Number *</label>
                    <input type="number" id="number" required placeholder="e.g., 1" min="1">
                </div>
                <div class="form-group">
                    <label>Course</label>
                    <input type="text" id="course" placeholder="e.g., Data Structures">
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="date">
                </div>
                <div class="form-group full">
                    <label>File Link (Google Drive / PDF)</label>
                    <input type="url" id="link" placeholder="https://drive.google.com/...">
                </div>
            </div>
            <button type="submit" class="submit-btn">💾 Save Sheet</button>
        </form>
    </div>
    <div class="form-card">
        <h3>📄 All Sheets</h3>
        <div id="sheetsList"></div>
    </div>
</div>
<script>
    if (localStorage.getItem('userType') !== 'admin') window.location.href = '../index.html';
    document.getElementById('date').valueAsDate = new Date();

    function renderSheets() {
        const list = document.getElementById('sheetsList');
        const sheets = JSON.parse(localStorage.getItem('sheets') || '[]');
        if (sheets.length === 0) { list.innerHTML = '<div class="empty-msg">No sheets yet.</div>'; return; }
        list.innerHTML = sheets.map((s, i) => `
            <div class="sheet-row">
                <div class="sheet-info">
                    <h4>Sheet ${s.number} - ${s.title}</h4>
                    <p>${s.course || 'General'} • ${s.date} ${s.link ? '• <a href="'+s.link+'" target="_blank" style="color:var(--teal)">View</a>' : ''}</p>
                </div>
                <button class="delete-btn" onclick="deleteSheet(${i})">🗑 Delete</button>
            </div>`).join('');
    }

    function deleteSheet(index) {
        if (!confirm('Delete?')) return;
        let s = JSON.parse(localStorage.getItem('sheets') || '[]');
        s.splice(index, 1);
        localStorage.setItem('sheets', JSON.stringify(s));
        renderSheets();
    }

    document.getElementById('sheetForm').addEventListener('submit', function(e) {
        e.preventDefault();
        let sheets = JSON.parse(localStorage.getItem('sheets') || '[]');
        sheets.push({
            id: Date.now(),
            title: document.getElementById('title').value,
            number: document.getElementById('number').value,
            course: document.getElementById('course').value,
            date: document.getElementById('date').value,
            link: document.getElementById('link').value
        });
        localStorage.setItem('sheets', JSON.stringify(sheets));
        this.reset();
        document.getElementById('date').valueAsDate = new Date();
        const t = document.getElementById('successToast');
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
        renderSheets();
    });
    renderSheets();
</script>
<script src="../js/storage.js"></script>
</body>
</html>
