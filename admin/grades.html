<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grades - Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        :root { --teal: #1a7a65; --teal-dark: #0d5c4a; --teal-light: #e8f5f1; }
        body { background: #f5f6f8; min-height: 100vh; }
        .admin-header { background: var(--teal); padding: 0 30px; height: 60px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .back-btn { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 7px 15px; border-radius: 7px; cursor: pointer; font-size: 13px; text-decoration: none; }
        .admin-header h2 { color: white; font-size: 18px; font-weight: 700; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .form-card { background: white; border: 1px solid #eee; border-radius: 12px; padding: 30px; margin-bottom: 25px; animation: fadeInUp 0.5s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .form-card h3 { font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 7px; }
        .form-group input, .form-group select { width: 100%; padding: 11px 14px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 14px; color: #333; transition: all 0.2s; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(26,122,101,0.1); }
        .submit-btn { background: var(--teal); color: white; border: none; padding: 12px 28px; border-radius: 9px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: 15px; }
        .submit-btn:hover { background: var(--teal-dark); transform: translateY(-2px); }
        .success-toast { background: #dcfce7; color: #166534; padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; border: 1px solid #bbf7d0; display: none; }

        /* Student Search */
        .search-bar { display: flex; gap: 12px; margin-bottom: 25px; }
        .search-bar input { flex: 1; padding: 11px 14px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 14px; outline: none; transition: all 0.2s; }
        .search-bar input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(26,122,101,0.1); }
        .search-btn { background: var(--teal); color: white; border: none; padding: 11px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s; }
        .search-btn:hover { background: var(--teal-dark); }

        /* Grades Table */
        .grades-table-wrap { overflow-x: auto; }
        .grades-table { width: 100%; border-collapse: collapse; min-width: 600px; }
        .grades-table th { background: #f0f7f4; padding: 12px 15px; font-size: 12px; font-weight: 700; color: #555; text-align: left; border-bottom: 2px solid #e0e0e0; }
        .grades-table td { padding: 13px 15px; font-size: 14px; color: #333; border-bottom: 1px solid #f0f0f0; }
        .grades-table tr:last-child td { border-bottom: none; }
        .grade-badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; }
        .grade-a { background: #dcfce7; color: #166534; }
        .grade-b { background: #dbeafe; color: #1e40af; }
        .grade-c { background: #fef9c3; color: #854d0e; }
        .grade-f { background: #fee2e2; color: #dc2626; }
        .delete-grade-btn { background: #fee2e2; color: #dc2626; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; transition: all 0.2s; }
        .delete-grade-btn:hover { background: #dc2626; color: white; }
        .empty-msg { text-align: center; padding: 40px; color: #aaa; font-size: 14px; }

        /* All students list */
        .students-overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .student-card { background: #f8f9fa; border: 1px solid #eee; border-radius: 8px; padding: 14px; cursor: pointer; transition: all 0.2s; }
        .student-card:hover { border-color: var(--teal); background: var(--teal-light); }
        .student-card .sid { font-size: 15px; font-weight: 700; color: #1a1a2e; }
        .student-card .scount { font-size: 12px; color: #888; margin-top: 4px; }

        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr 1fr; } .container { padding: 0 15px; } .students-overview { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
<header class="admin-header">
    <div style="display:flex;align-items:center;gap:12px;">
        <a href="index.html" class="back-btn">← Back</a>
        <h2>📊 Manage Grades</h2>
    </div>
    <span style="color:rgba(255,255,255,0.7);font-size:13px;">Admin Panel</span>
</header>
<div class="container">

    <!-- Add Grade Form -->
    <div class="form-card">
        <h3>📊 Add Student Grade</h3>
        <div class="success-toast" id="successToast">✅ Grade saved!</div>
        <form id="gradeForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>Student ID *</label>
                    <input type="text" id="studentId" required placeholder="e.g., 262001">
                </div>
                <div class="form-group">
                    <label>Subject *</label>
                    <input type="text" id="subject" required placeholder="e.g., Programming Basics">
                </div>
                <div class="form-group">
                    <label>Grade *</label>
                    <select id="grade" required>
                        <option value="">Select grade</option>
                        <option>ممتاز (A+)</option>
                        <option>امتياز (A)</option>
                        <option>جيد جداً (B+)</option>
                        <option>جيد (B)</option>
                        <option>مقبول (C)</option>
                        <option>راسب (F)</option>
                        <option>A+</option>
                        <option>A</option>
                        <option>B+</option>
                        <option>B</option>
                        <option>C</option>
                        <option>D</option>
                        <option>F</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Term</label>
                    <input type="text" id="term" placeholder="e.g., Semester 1 - 2025">
                </div>
                <div class="form-group">
                    <label>Overall Status</label>
                    <select id="overall">
                        <option value="">Select</option>
                        <option>ناجح (ممتاز)</option>
                        <option>ناجح (جيد جداً)</option>
                        <option>ناجح (جيد)</option>
                        <option>ناجح (مقبول)</option>
                        <option>راسب</option>
                        <option>Pass</option>
                        <option>Fail</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="submit-btn">💾 Save Grade</button>
        </form>
    </div>

    <!-- Search Student Grades -->
    <div class="form-card">
        <h3>🔍 View Student Grades</h3>
        <div class="search-bar">
            <input type="text" id="searchId" placeholder="Enter Student ID (e.g., 262001)">
            <button class="search-btn" onclick="searchStudent()">Search</button>
        </div>
        <div id="studentGradesView"></div>
    </div>

    <!-- All Students with Grades -->
    <div class="form-card">
        <h3>👥 Students with Grades</h3>
        <div class="students-overview" id="studentsOverview"></div>
    </div>

</div>
<script>
    if (localStorage.getItem('userType') !== 'admin') window.location.href = '../index.html';

    function getGradeClass(grade) {
        if (grade.includes('A') || grade.includes('ممتاز') || grade.includes('امتياز')) return 'grade-a';
        if (grade.includes('B') || grade.includes('جيد')) return 'grade-b';
        if (grade.includes('C') || grade.includes('مقبول')) return 'grade-c';
        return 'grade-f';
    }

    function renderStudentsOverview() {
        const all = JSON.parse(localStorage.getItem('grades') || '{}');
        const container = document.getElementById('studentsOverview');
        const ids = Object.keys(all);
        if (ids.length === 0) { container.innerHTML = '<div class="empty-msg" style="grid-column:1/-1">No grades entered yet.</div>'; return; }
        container.innerHTML = ids.map(id => `
            <div class="student-card" onclick="document.getElementById('searchId').value='${id}';searchStudent()">
                <div class="sid">ID: ${id}</div>
                <div class="scount">${all[id].length} grade(s)</div>
            </div>`).join('');
    }

    function searchStudent() {
        const id = document.getElementById('searchId').value.trim();
        const container = document.getElementById('studentGradesView');
        if (!id) { container.innerHTML = ''; return; }
        const all = JSON.parse(localStorage.getItem('grades') || '{}');
        const grades = all[id] || [];
        if (grades.length === 0) {
            container.innerHTML = `<div class="empty-msg">No grades found for student ID: ${id}</div>`;
            return;
        }
        container.innerHTML = `
            <div class="grades-table-wrap">
                <table class="grades-table">
                    <thead><tr><th>Subject</th><th>Grade</th><th>Term</th><th>Date</th><th>Action</th></tr></thead>
                    <tbody>
                        ${grades.map((g, i) => `
                        <tr>
                            <td>${g.subject}</td>
                            <td><span class="grade-badge ${getGradeClass(g.grade)}">${g.grade}</span></td>
                            <td>${g.term || '-'}</td>
                            <td>${g.date || '-'}</td>
                            <td><button class="delete-grade-btn" onclick="deleteGrade('${id}', ${i})">🗑</button></td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div>`;
    }

    function deleteGrade(studentId, index) {
        if (!confirm('Delete this grade?')) return;
        let all = JSON.parse(localStorage.getItem('grades') || '{}');
        all[studentId].splice(index, 1);
        if (all[studentId].length === 0) delete all[studentId];
        localStorage.setItem('grades', JSON.stringify(all));
        searchStudent();
        renderStudentsOverview();
    }

    document.getElementById('gradeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const sid = document.getElementById('studentId').value.trim();
        let all = JSON.parse(localStorage.getItem('grades') || '{}');
        if (!all[sid]) all[sid] = [];
        all[sid].push({
            subject: document.getElementById('subject').value,
            grade: document.getElementById('grade').value,
            term: document.getElementById('term').value,
            overall: document.getElementById('overall').value,
            date: new Date().toLocaleDateString()
        });
        localStorage.setItem('grades', JSON.stringify(all));
        this.reset();
        const t = document.getElementById('successToast');
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
        renderStudentsOverview();
    });

    renderStudentsOverview();
</script>
<script src="../js/storage.js"></script>
</body>
</html>
