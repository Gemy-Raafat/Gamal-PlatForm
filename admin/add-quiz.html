<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Quiz - Admin</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      :root {
        --teal: #0d7b6e;
        --teal-dark: #1a5f5f;
      }
      html,
      body {
        width: 100%;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }
      body {
        background: #f5f6fa;
      }
      .top-header {
        background: var(--teal-dark);
        padding: 0 30px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo-mark {
        width: 38px;
        height: 38px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 18px;
      }
      .header-left span {
        color: white;
        font-weight: 700;
        font-size: 15px;
      }
      .back-btn {
        background: rgba(255, 255, 255, 0.15);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        padding: 8px 18px;
        font-size: 14px;
        text-decoration: none;
      }
      .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 0 25px;
      }
      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #6b7280;
        font-size: 14px;
        margin-bottom: 25px;
      }
      .breadcrumb a {
        color: #6b7280;
        text-decoration: none;
      }
      .form-card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 35px;
        margin-bottom: 30px;
        animation: slideUp 0.4s ease-out;
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .form-card h2 {
        font-size: 22px;
        font-weight: 800;
        color: #111827;
        margin-bottom: 25px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .form-group {
        margin-bottom: 5px;
      }
      .form-group.span-2 {
        grid-column: span 2;
      }
      .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #374151;
        margin-bottom: 7px;
      }
      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        font-size: 14px;
        color: #111827;
        background: white;
        outline: none;
      }
      .form-group input:focus,
      .form-group textarea:focus {
        border-color: var(--teal);
      }
      .form-group textarea {
        resize: vertical;
        min-height: 80px;
      }
      .btn-submit {
        background: linear-gradient(135deg, var(--teal), #2d9e7a);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 13px 35px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 10px;
      }
      .success-alert {
        background: #dcfce7;
        border: 1px solid #bbf7d0;
        color: #15803d;
        padding: 14px 18px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
      }
      .items-card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 25px;
      }
      .items-card h3 {
        font-size: 18px;
        font-weight: 700;
        color: #111827;
        margin-bottom: 20px;
      }
      .item-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 0;
        border-bottom: 1px solid #f3f4f6;
        gap: 12px;
      }
      .item-row:last-child {
        border-bottom: none;
      }
      .item-info {
        flex: 1;
      }
      .item-title {
        font-size: 15px;
        font-weight: 600;
        color: #111827;
        margin-bottom: 3px;
      }
      .item-meta {
        font-size: 12px;
        color: #6b7280;
      }
      .delete-btn {
        background: #fee2e2;
        color: #dc2626;
        border: 1px solid #fca5a5;
        border-radius: 6px;
        padding: 6px 14px;
        font-size: 13px;
        cursor: pointer;
        flex-shrink: 0;
      }
      .no-items {
        text-align: center;
        padding: 30px;
        color: #9ca3af;
        font-size: 14px;
      }
      @media (max-width: 768px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
        .form-group.span-2 {
          grid-column: span 1;
        }
      }
    </style>
  </head>
  <body>
    <header class="top-header">
      <div class="header-left">
        <div class="logo-mark">G</div>
        <span>Admin Panel</span>
      </div>
      <a href="index.html" class="back-btn">← Back</a>
    </header>
    <div class="container">
      <div class="breadcrumb">
        <a href="index.html">🏠 Dashboard</a><span>›</span><span>Add Quiz</span>
      </div>
      <div class="form-card">
        <h2>❓ Add New Quiz</h2>
        <div class="success-alert" id="successAlert">
          ✅ Quiz added successfully!
        </div>
        <form id="quizForm">
          <div class="form-grid">
            <div class="form-group">
              <label>Quiz Title *</label
              ><input type="text" id="title" required />
            </div>
            <div class="form-group">
              <label>Subject / Course</label><input type="text" id="subject" />
            </div>
            <div class="form-group">
              <label>Release Date</label><input type="date" id="date" />
            </div>
            <div class="form-group">
              <label>Deadline</label><input type="date" id="deadline" />
            </div>
            <div class="form-group span-2">
              <label>Quiz URL</label
              ><input
                type="url"
                id="quizUrl"
                placeholder="https://forms.google.com/..."
              />
            </div>
            <div class="form-group span-2">
              <label>Description</label><textarea id="description"></textarea>
            </div>
          </div>
          <button type="submit" class="btn-submit">Add Quiz</button>
        </form>
      </div>
      <div class="items-card">
        <h3>📋 All Quizzes</h3>
        <div id="quizzesList"></div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/cloud.js"></script>
    <script>
      if (localStorage.getItem("userType") !== "admin")
        window.location.href = "../index.html";
      document.getElementById("date").value = new Date()
        .toISOString()
        .split("T")[0];

      function loadList() {
        CloudStorage.get("quizzes").then((quizzes) => {
          const data = quizzes || [];
          const list = document.getElementById("quizzesList");
          if (data.length === 0) {
            list.innerHTML = '<div class="no-items">No quizzes yet.</div>';
            return;
          }
          list.innerHTML = data
            .map(
              (q, idx) => `
                    <div class="item-row">
                        <div class="item-info">
                            <div class="item-title">${q.title}</div>
                            <div class="item-meta">${q.subject || ""} | Deadline: ${q.deadline || "N/A"}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteItem(${idx})">🗑 Delete</button>
                    </div>
                `,
            )
            .join("");
        });
      }

      function deleteItem(idx) {
        if (!confirm("Delete?")) return;
        CloudStorage.remove("quizzes", idx).then(() => loadList());
      }

      document
        .getElementById("quizForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          CloudStorage.add("quizzes", {
            id: Date.now(),
            title: document.getElementById("title").value,
            subject: document.getElementById("subject").value,
            date: document.getElementById("date").value,
            deadline: document.getElementById("deadline").value,
            quizUrl: document.getElementById("quizUrl").value,
            description: document.getElementById("description").value,
          }).then(() => {
            document.getElementById("successAlert").style.display = "block";
            setTimeout(
              () =>
                (document.getElementById("successAlert").style.display =
                  "none"),
              3000,
            );
            this.reset();
            document.getElementById("date").value = new Date()
              .toISOString()
              .split("T")[0];
            loadList();
          });
        });

      loadList();
    </script>
  </body>
</html>
