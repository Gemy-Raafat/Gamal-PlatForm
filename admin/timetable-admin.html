<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Timetable - Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        :root { --teal: #0d7b6e; --teal-dark: #1a5f5f; }
        body { background: #f5f6fa; min-height: 100vh; }
        .top-header { background: var(--teal-dark); padding: 0 30px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .logo-mark { width: 38px; height: 38px; background: rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px; }
        .header-left span { color: white; font-weight: 700; font-size: 15px; }
        .back-btn { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; padding: 8px 18px; font-size: 14px; text-decoration: none; }
        .container { max-width: 1100px; margin: 40px auto; padding: 0 25px; }
        .breadcrumb { display: flex; align-items: center; gap: 6px; color: #6b7280; font-size: 14px; margin-bottom: 25px; }
        .breadcrumb a { color: #6b7280; text-decoration: none; }

        .info-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #1e40af;
        }

        .form-card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 30px; margin-bottom: 25px; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .form-card h2 { font-size: 20px; font-weight: 800; color: #111827; margin-bottom: 20px; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 7px; }
        .form-group input, .form-group select { width: 100%; padding: 11px 14px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 14px; color: #111827; outline: none; transition: all 0.2s; }
        .form-group input:focus { border-color: var(--teal); }

        .schedule-title { font-size: 15px; font-weight: 700; color: #374151; margin-bottom: 12px; margin-top: 10px; }

        .day-section { margin-bottom: 15px; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
        .day-header { padding: 12px 16px; background: #f9fafb; font-weight: 700; color: #374151; font-size: 14px; }

        .period-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            padding: 12px 16px;
        }

        .period-input {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .period-input label { font-size: 11px; color: #6b7280; font-weight: 600; }
        .period-input input { padding: 8px 10px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 12px; }

        .btn-submit { background: linear-gradient(135deg, var(--teal), #2d9e7a); color: white; border: none; border-radius: 8px; padding: 13px 35px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(13, 123, 110, 0.3); }

        .success-alert { background: #dcfce7; border: 1px solid #bbf7d0; color: #15803d; padding: 12px 18px; border-radius: 8px; margin-top: 15px; display: none; }

        .existing-tt { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 25px; }
        .existing-tt h3 { font-size: 18px; font-weight: 700; color: #111827; margin-bottom: 15px; }
        .tt-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #f3f4f6; gap: 12px; }
        .tt-item:last-child { border-bottom: none; }
        .tt-title { font-size: 15px; font-weight: 600; color: #111827; }
        .tt-meta { font-size: 12px; color: #6b7280; }
        .delete-btn { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer; flex-shrink: 0; }
        .no-items { text-align: center; padding: 30px; color: #9ca3af; }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .period-row { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <header class="top-header">
        <div class="header-left">
            <div class="logo-mark">G</div>
            <span>Admin Panel</span>
        </div>
        <a href="index.html" class="back-btn">← Back</a>
    </header>

    <div class="container">
        <div class="breadcrumb">
            <a href="index.html">🏠 Dashboard</a>
            <span>›</span>
            <span>Manage Timetable</span>
        </div>

        <div class="info-box">
            💡 Fill in the timetable details below. Enter class names for each day and period slot.
        </div>

        <div class="form-card">
            <h2>📅 Create New Timetable</h2>

            <div class="success-alert" id="successAlert">✅ Timetable saved successfully!</div>

            <form id="ttForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Level / Title</label>
                        <input type="text" id="ttLevel" placeholder="e.g. Third Level - Network Track">
                    </div>
                    <div class="form-group">
                        <label>Academic Year</label>
                        <input type="text" id="ttYear" placeholder="e.g. 2025-2026">
                    </div>
                    <div class="form-group">
                        <label>Program</label>
                        <input type="text" id="ttProgram" placeholder="e.g. Information Technology">
                    </div>
                    <div class="form-group">
                        <label>Term</label>
                        <select id="ttTerm">
                            <option>First Term</option>
                            <option>Second Term</option>
                        </select>
                    </div>
                </div>

                <!-- Period Headers -->
                <p class="schedule-title">📋 Enter periods (time slots):</p>
                <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:20px">
                    <div class="form-group">
                        <label style="font-size:12px">Period 1</label>
                        <input type="text" id="p1" placeholder="9:00-9:40">
                    </div>
                    <div class="form-group">
                        <label style="font-size:12px">Period 2</label>
                        <input type="text" id="p2" placeholder="9:40-10:20">
                    </div>
                    <div class="form-group">
                        <label style="font-size:12px">Period 3</label>
                        <input type="text" id="p3" placeholder="10:20-11:00">
                    </div>
                    <div class="form-group">
                        <label style="font-size:12px">Period 4</label>
                        <input type="text" id="p4" placeholder="11:00-11:40">
                    </div>
                    <div class="form-group">
                        <label style="font-size:12px">Period 5</label>
                        <input type="text" id="p5" placeholder="11:40-12:20">
                    </div>
                </div>

                <!-- Days Schedule -->
                <p class="schedule-title">📆 Enter schedule for each day:</p>

                <div id="daysContainer"></div>

                <button type="submit" class="btn-submit">💾 Save Timetable</button>
            </form>
        </div>

        <div class="existing-tt">
            <h3>Saved Timetables</h3>
            <div id="ttList"></div>
        </div>
    </div>

    <script>
        if (localStorage.getItem('userType') !== 'admin') window.location.href = '../index.html';

        const days = ['Saturday', 'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday','Friday'];

        // Build day sections
        const daysContainer = document.getElementById('daysContainer');
        days.forEach(day => {
            const section = document.createElement('div');
            section.className = 'day-section';
            section.innerHTML = `
                <div class="day-header">📅 ${day}</div>
                <div class="period-row">
                    ${[1,2,3,4,5].map(p => `
                        <div class="period-input">
                            <label>Period ${p}</label>
                            <input type="text" id="${day}_p${p}_name" placeholder="Subject name">
                            <input type="text" id="${day}_p${p}_teacher" placeholder="Teacher">
                            <input type="text" id="${day}_p${p}_room" placeholder="Room">
                        </div>
                    `).join('')}
                </div>`;
            daysContainer.appendChild(section);
        });

        function loadTtList() {
            const tts = JSON.parse(localStorage.getItem('timetables') || '[]');
            const list = document.getElementById('ttList');
            if (tts.length === 0) { list.innerHTML = '<div class="no-items">No timetables yet.</div>'; return; }
            list.innerHTML = tts.map((tt, idx) => `
                <div class="tt-item">
                    <div>
                        <div class="tt-title">${tt.level || 'Timetable'}</div>
                        <div class="tt-meta">${tt.program || ''} | ${tt.year || ''} | ${tt.term || ''}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteTt(${idx})">🗑 Delete</button>
                </div>
            `).join('');
        }

        function deleteTt(idx) {
            if (!confirm('Delete this timetable?')) return;
            const tts = JSON.parse(localStorage.getItem('timetables') || '[]');
            tts.splice(idx, 1);
            localStorage.setItem('timetables', JSON.stringify(tts));
            loadTtList();
        }

        document.getElementById('ttForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const periods = [
                document.getElementById('p1').value,
                document.getElementById('p2').value,
                document.getElementById('p3').value,
                document.getElementById('p4').value,
                document.getElementById('p5').value
            ].filter(p => p);

            const schedule = {};
            days.forEach(day => {
                schedule[day] = [1,2,3,4,5].map(p => ({
                    name: document.getElementById(`${day}_p${p}_name`).value,
                    teacher: document.getElementById(`${day}_p${p}_teacher`).value,
                    room: document.getElementById(`${day}_p${p}_room`).value
                }));
            });

            const tts = JSON.parse(localStorage.getItem('timetables') || '[]');
            tts.push({
                id: Date.now(),
                level: document.getElementById('ttLevel').value,
                year: document.getElementById('ttYear').value,
                program: document.getElementById('ttProgram').value,
                term: document.getElementById('ttTerm').value,
                periods,
                schedule
            });

            localStorage.setItem('timetables', JSON.stringify(tts));

            document.getElementById('successAlert').style.display = 'block';
            setTimeout(() => document.getElementById('successAlert').style.display = 'none', 3000);

            loadTtList();
        });

        loadTtList();
    </script>
    <script src="../js/storage.js"></script>
</body>
</html>
